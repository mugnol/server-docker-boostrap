#cloud-config
# ============================================================================
# DigitalOcean droplet user-data TEMPLATE (Docker edition, ASCII-safe).
#
# HOW TO USE:
#   1. Copy this file to a private location as "cloud-config.yaml"
#   2. Fill in your SSH public key and your Kimi Code Console API key
#      (create one at https://www.kimi.com/code/console)
#   3. Paste the FILLED file into: Create Droplet -> Advanced Options
#      -> User Data
#
# The host only installs Docker and starts the "devbox" container.
# Everything else (tools, Kimi Code, projects) lives INSIDE the container.
#
# NEVER commit the filled file anywhere - it contains secrets.
# ============================================================================

users:
  - name: dev
    groups: sudo,docker
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ssh-ed25519 < * * * Paste your public key here * * * >

package_update: true
packages:
  - git
  - docker.io

write_files:
  # Secrets and variables - 0600, root-only, shredded at the end of the run
  - path: /opt/bootstrap/vars.env
    permissions: "0600"
    content: |
      BOOTSTRAP_REPO=https://github.com/mugnol/server-docker-boostrap.git
      KIMI_API_KEY=sk-kimi- < * * * Paste your API key here * * * >
      GH_TOKEN=
      # GH_TOKEN is optional: fine-grained GitHub PAT, only for private repos

  - path: /opt/bootstrap/run.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      source /opt/bootstrap/vars.env
      DEV_HOME=/home/dev

      # 1. Fetch the bootstrap repo (Dockerfile, entrypoint.sh, lists)
      sudo -u dev git clone "$BOOTSTRAP_REPO" "$DEV_HOME/bootstrap"

      # 2. Build the devbox image
      cd "$DEV_HOME/bootstrap"
      docker build -t devbox .

      # 3. Start the devbox container.
      #    Secrets are passed as environment variables - never baked into
      #    the image. Projects live in a named volume so they survive
      #    container recreation.
      docker run -d \
        --name devbox \
        --restart unless-stopped \
        -e KIMI_API_KEY="$KIMI_API_KEY" \
        -e GH_TOKEN="${GH_TOKEN:-}" \
        -e RUN_KIMI_TASK=true \
        -v devbox-projects:/home/dev/projects \
        devbox

      # 4. Remove secrets from disk
      shred -u /opt/bootstrap/vars.env 2>/dev/null || rm -f /opt/bootstrap/vars.env

runcmd:
  - /opt/bootstrap/run.sh
